version: '3.9'

services:
  api:
    build: .
    container_name: ai-undetectable-api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./backend:/app
    environment:
      DATABASE_URL: sqlite:///./ai_undetectable.db
      STRIPE_SECRET_KEY: sk_test_dummy
      ENVIRONMENT: development
      DEBUG: "true"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

