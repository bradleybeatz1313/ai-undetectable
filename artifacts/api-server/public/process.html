<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process - AI Undetectable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #16161f;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b0;
            --text-muted: #6a6a7a;
            --accent-cyan: #00d4ff;
            --accent-violet: #7c3aed;
            --accent-gradient: linear-gradient(135deg, #00d4ff, #7c3aed);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --glow-cyan: rgba(0, 212, 255, 0.25);
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar .logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .topbar .logo span { color: var(--accent-cyan); }

        .topbar a.back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .topbar a.back:hover { color: var(--text-primary); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 40px;
        }

        .drop-zone {
            border: 2px dashed var(--border-hover);
            border-radius: 16px;
            padding: 64px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--bg-secondary);
            position: relative;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.03);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.06);
        }

        .drop-zone.has-file {
            border-color: var(--accent-cyan);
            border-style: solid;
            padding: 24px;
        }

        .drop-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 12px;
            background: rgba(0, 212, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-icon svg { width: 28px; height: 28px; stroke: var(--accent-cyan); fill: none; stroke-width: 1.5; }

        .drop-text { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .drop-hint { font-size: 13px; color: var(--text-muted); }

        .file-input { display: none; }

        .preview-area {
            display: none;
            gap: 24px;
            margin-top: 0;
        }

        .preview-area.visible {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .preview-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
        }

        .preview-card .label {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-card .label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-original { background: #f59e0b; }
        .dot-processed { background: #10b981; }

        .preview-card .img-wrap {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            background: var(--bg-secondary);
        }

        .preview-card img {
            max-width: 100%;
            max-height: 360px;
            border-radius: 6px;
            object-fit: contain;
        }

        .preview-card .placeholder {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-process {
            background: var(--accent-gradient);
            color: #fff;
        }

        .btn-process:hover {
            box-shadow: 0 0 30px var(--glow-cyan);
            transform: translateY(-1px);
        }

        .btn-process:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-download {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: none;
        }

        .btn-download.visible { display: inline-flex; }

        .btn-download:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
        }

        .btn-reset:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .status {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-muted);
            min-height: 20px;
        }

        .status.error { color: #ef4444; }
        .status.success { color: #10b981; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .file-info .name {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--accent-cyan);
        }

        .file-info .size {
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .preview-area.visible {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn { width: 100%; justify-content: center; }

            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <a href="/" class="logo">AI <span>Undetectable</span></a>
    <a href="/" class="back">Back to home</a>
</div>

<div class="container">
    <h1>Process Image</h1>
    <p class="subtitle">Upload an AI-generated image and get back an undetectable version.</p>

    <div class="drop-zone" id="dropZone">
        <div class="drop-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <p class="drop-text">Drop an image here or click to browse</p>
        <p class="drop-hint">JPG, PNG, WebP, GIF — max 4.5MB</p>
        <input type="file" class="file-input" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.webp">
    </div>

    <div class="preview-area" id="previewArea">
        <div class="preview-card">
            <div class="label"><span class="dot dot-original"></span> Original</div>
            <div class="img-wrap">
                <img id="originalImg" alt="Original image">
            </div>
        </div>
        <div class="preview-card">
            <div class="label"><span class="dot dot-processed"></span> Processed</div>
            <div class="img-wrap">
                <img id="processedImg" alt="Processed image" style="display:none">
                <div class="placeholder" id="processedPlaceholder">Will appear after processing</div>
            </div>
        </div>
    </div>

    <div class="actions" id="actions" style="display:none">
        <button class="btn btn-process" id="processBtn" onclick="processImage()">
            Process Image
        </button>
        <a class="btn btn-download" id="downloadBtn" download="undetectable.jpg">
            Download Result
        </a>
        <button class="btn btn-reset" onclick="resetAll()">
            Clear
        </button>
    </div>

    <div class="status" id="status"></div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewArea = document.getElementById('previewArea');
    const originalImg = document.getElementById('originalImg');
    const processedImg = document.getElementById('processedImg');
    const processedPlaceholder = document.getElementById('processedPlaceholder');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const actionsDiv = document.getElementById('actions');
    const statusDiv = document.getElementById('status');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
        const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        if (!validTypes.includes(file.type)) {
            setStatus('Invalid file type. Use JPG, PNG, WebP, or GIF.', 'error');
            return;
        }
        if (file.size > 4.5 * 1024 * 1024) {
            setStatus('File too large. Max 4.5MB.', 'error');
            return;
        }

        selectedFile = file;

        const reader = new FileReader();
        reader.onload = (e) => {
            originalImg.src = e.target.result;
            dropZone.style.display = 'none';
            previewArea.classList.add('visible');
            actionsDiv.style.display = 'flex';
            processedImg.style.display = 'none';
            processedPlaceholder.style.display = 'block';
            downloadBtn.classList.remove('visible');
            setStatus('');
        };
        reader.readAsDataURL(file);
    }

    async function processImage() {
        if (!selectedFile) return;

        processBtn.disabled = true;
        processBtn.innerHTML = '<span class="spinner"></span> Processing...';
        setStatus('Sending image to API...', '');

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const resp = await fetch('/api/process', {
                method: 'POST',
                headers: { 'X-API-Key': 'demo-key' },
                body: formData
            });

            if (!resp.ok) {
                const err = await resp.json().catch(() => ({ detail: resp.statusText }));
                throw new Error(err.detail || 'Processing failed');
            }

            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);

            processedImg.src = url;
            processedImg.style.display = 'block';
            processedPlaceholder.style.display = 'none';

            downloadBtn.href = url;
            downloadBtn.classList.add('visible');

            setStatus('Done! Image processed successfully.', 'success');
        } catch (e) {
            setStatus('Error: ' + e.message, 'error');
        } finally {
            processBtn.disabled = false;
            processBtn.innerHTML = 'Process Image';
        }
    }

    function resetAll() {
        selectedFile = null;
        fileInput.value = '';
        dropZone.style.display = '';
        previewArea.classList.remove('visible');
        actionsDiv.style.display = 'none';
        downloadBtn.classList.remove('visible');
        processedImg.style.display = 'none';
        processedPlaceholder.style.display = 'block';
        setStatus('');
    }

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = 'status' + (type ? ' ' + type : '');
    }
</script>

</body>
</html>
